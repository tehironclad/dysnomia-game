; Release presets (docs/RELEASE_CHECKLIST.md). Release templates only, no debug.
; Non-resource files the game reads at runtime are included via include_filter;
; dev tools, tests and docs are excluded from the shipped pack.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/data/*.json, assets/web/*.html, assets/arcade/cartridges/*.fkc, assets/arcade/cartridges/*.json"
exclude_filter="tools/*, tests/*, docs/*, .claude/*"
export_path="build/windows/Dysnomia.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

