# Release: on a version tag (v1.2.3), check → export Windows/Linux/macOS with release
# templates → zip, plus a Windows installer (NSIS, installer/windows/dysnomia.nsi) → SHA-256 →
# a GitHub Release v<version> on this repo with the zips, the installer, SHA256SUMS and latest.json.
# The site (https://enterdysnomia.com/download, and /api/download-manifest that the game's update
# notice reads) reads latest.json from this repo's latest release. No secrets: the workflow's own
# token creates the release.
# The installer is unsigned: Windows SmartScreen warns on first run (More info → Run anyway) until
# release signing lands (docs/SECURITY_AUDIT.md).
#
# Supply chain (docs/SECURITY_AUDIT.md): third-party actions are pinned to a commit SHA
# (the tag in the comment); Godot and its export templates are checked against SHA-512
# sums pinned here (from the 4.6.1-stable release's SHA512-SUMS.txt) before they run;
# NSIS, ImageMagick and librsvg come from Ubuntu's signed apt archive (makensis must be 3.x);
# the workflow token can write releases only (contents: write) and the only triggers are a v* tag
# or a manual run by someone with write access (never a pull request);
# inputs never reach a shell through ${{ }}.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.9.0)"
        required: true
      publish:
        description: "Publish a GitHub Release v<version> (else build only: the files stay a workflow artifact)"
        type: boolean
        default: false

permissions:
  contents: write  # the GitHub Release (runs only from a v* tag or a manual run by someone with write access)

env:
  GODOT_VERSION: "4.6.1"
  # SHA512-SUMS.txt of https://github.com/godotengine/godot/releases/tag/4.6.1-stable
  GODOT_SHA512: "a76fd0fe1d44a2dd6c065b6f7b434ad75f5593c07bda3d3017f8304f2d069acbcf0f39cb5d0976f0434b56e9ea852032ddbcbdb7e0ce1c75a47e1dacb6794bd7"
  TEMPLATES_SHA512: "d80001711c07973b1fd3e88077ba99644e19db7c9e52627e16f38a2937879f809f94dbd8493936fb8204908bbc57a521d41173dce5208061fe4c99772490c541"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          lfs: true
          persist-credentials: false

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$INPUT_VERSION"; fi
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version '$V'"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # The binary reports the same version as the tag
          sed -i "s/^config\/version=.*//" project.godot
          sed -i "/^\[application\]/a config/version=\"$V\"" project.godot

      - name: Godot + export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL --proto '=https' --tlsv1.2 -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL --proto '=https' --tlsv1.2 -o tpl.tpz   "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          echo "${TEMPLATES_SHA512}  tpl.tpz" | sha512sum -c -
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest" && unzip -q tpl.tpz -d tpl && mv tpl/templates/* "$dest/"

      - name: Installer tools (NSIS, icon conversion)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nsis imagemagick librsvg2-bin
          makensis -VERSION | grep -Eq '^v3\.' || { echo "makensis 3.x required"; makensis -VERSION; exit 1; }

      - name: Checks (import, compile, shaders, unit tests)
        run: GODOT=./godot tools/check.sh

      - name: Windows icon (icon.svg → .ico, set on the Windows preset only)
        run: |
          installer/windows/make_icon.sh icon.svg build/icon/dysnomia.ico
          # [preset.0.options] is Windows; the macOS preset has its own application/icon line
          sed -i '/^\[preset\.0\.options\]/,/^\[preset\.1\]/ s|^application/icon=.*|application/icon="res://build/icon/dysnomia.ico"|' export_presets.cfg
          [ "$(grep -c '^application/icon="res://build/icon/dysnomia.ico"' export_presets.cfg)" = 1 ] || { echo "icon not set on the Windows preset"; exit 1; }

      - name: Export
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -e
          mkdir -p build/windows build/linux build/macos dist
          ./godot --headless --path . --export-release "Windows" build/windows/Dysnomia.exe
          ./godot --headless --path . --export-release "Linux"   build/linux/Dysnomia.x86_64
          ./godot --headless --path . --export-release "macOS"   build/macos/Dysnomia.zip
          # The installer carries exactly Dysnomia.exe + Dysnomia.pck: anything else in the export would be missed
          extra="$(ls -A build/windows | grep -vxE 'Dysnomia\.(exe|pck)' || true)"
          [ -z "$extra" ] || { echo "unexpected files in the Windows export (add them to dysnomia.nsi): $extra"; exit 1; }
          [ -f build/windows/Dysnomia.exe ] && [ -f build/windows/Dysnomia.pck ] || { echo "Windows export incomplete"; exit 1; }
          (cd build/windows && zip -qr9 "../../dist/Dysnomia-${V}-windows-x86_64.zip" .)
          (cd build/linux   && chmod +x Dysnomia.x86_64 && zip -qr9 "../../dist/Dysnomia-${V}-linux-x86_64.zip" .)
          cp build/macos/Dysnomia.zip "dist/Dysnomia-${V}-macos-universal.zip"
          makensis -V2 -DVERSION="$V" -DSRC_DIR="$PWD/build/windows" -DICON="$PWD/build/icon/dysnomia.ico" \
            -DOUT_FILE="$PWD/dist/Dysnomia-${V}-windows-setup.exe" installer/windows/dysnomia.nsi
          # Nothing from user:// or the dev tree may ride along
          for z in dist/*.zip; do
            if unzip -l "$z" | grep -Eq '(\.env|settings\.cfg|arcade_credits|wagers_agreed|tokens\.json|\.claude/|/tools/|/tests/)'; then echo "unexpected file in $z"; exit 1; fi
          done
          # The installer's contents are fixed by dysnomia.nsi (the two files checked above)
          [ "$(ls dist/*.exe)" = "dist/Dysnomia-${V}-windows-setup.exe" ] || { echo "installer missing"; exit 1; }
          (cd dist && sha256sum *.zip *.exe > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Manifest
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          # The files live on this repo's release v<v>
          FILES="https://github.com/$GITHUB_REPOSITORY/releases/download/v$V"
          python3 - "$V" "$FILES" "$GITHUB_SHA" <<'EOF'
          import hashlib, json, os, sys, datetime
          v, base, sha = sys.argv[1], sys.argv[2].rstrip("/"), sys.argv[3]
          files = []
          for name in sorted(os.listdir("dist")):
              if name.endswith(".zip"):
                  kind = "zip"
              elif name.endswith("-windows-setup.exe"):
                  kind = "installer"
              else:
                  continue
              p = os.path.join("dist", name)
              plat = "windows" if "windows" in name else "macos" if "macos" in name else "linux"
              files.append({"platform": plat, "kind": kind, "name": name, "size": os.path.getsize(p),
                            "sha256": hashlib.sha256(open(p, "rb").read()).hexdigest(),
                            "url": f"{base}/{name}"})
          json.dump({"version": v, "commit": sha, "published": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                     "files": files, "sums": f"{base}/SHA256SUMS"},
                    open("dist/latest.json", "w"), indent=2)
          EOF
          cat dist/latest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dysnomia-${{ steps.v.outputs.version }}
          path: dist/

      - name: GitHub Release (a v* tag, or a manual run from master with publish ticked)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "false" ] || { echo "The repo is private: players couldn't download a release"; exit 1; }
          notes="Download: https://enterdysnomia.com/download (checks the SHA-256 for you). Built by this workflow from commit $GITHUB_SHA. A community project: not made, endorsed or run by the creator of Dysnomia."
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Re-publishing a version (e.g. a rebuild): replace its files, keep the release
            gh release upload "v$V" dist/*.zip dist/*.exe dist/SHA256SUMS dist/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$V" dist/*.zip dist/*.exe dist/SHA256SUMS dist/latest.json \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Dysnomia $V" --latest --notes "$notes"
          fi
